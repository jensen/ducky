function sleep(){if(kills<goal){toast(`Defeat ${goal-kills} more monsters before hibernating!`);return}show(`<div style="font-size:56px">🌙 💤 ✨</div><h1>Time to Hibernate!</h1><p>You curl up in a cozy nest and sleep through the winter. When spring comes, you've grown a little bigger!</p><p class="notice">Chapter ${level} complete · ${level===1?'Ducklings become teenagers!':'Teenagers become grown-up birds!'}</p><button class="bigbtn" data-action="next">Wake up in spring 🌸</button>`)}function next(){level++;goal=level===2?50:70;for(const p of players){p.age=level-1;p.maxHp+=2;p.hp=p.maxHp;p.damage+=.4;p.speed+=10;p.x=W*(p.id?.6:.4);p.y=H*.55}enemies=[];bullets=[];drops=[];spawnClock=0;hide();toast(level===2?'You are teenagers now!':'You are all grown up! Find your parents!')}

function spawn(){let side=Math.floor(rnd(0,4)),x=side===0?-22:side===1?W+22:rnd(10,W-10),y=side===2?65:side===3?H+22:rnd(90,H-15);let roll=Math.random(),type=roll<.49?0:roll<.8?1:2;enemies.push({x,y,type,hp:(type===0?2:type===1?3:5)+level*.5,maxHp:(type===0?2:type===1?3:5)+level*.5,speed:(type===0?48:type===1?70:38)+level*7,hit:0,seed:rnd(0,100),s:type===2?22:type===1?17:15})}
function shoot(p){let target=null,best=p.range;for(const e of enemies){let d=dist(p,e);if(d<best){best=d;target=e}}if(!target)return;const a=Math.atan2(target.y-p.y,target.x-p.x);for(const off of p.weapon?[-.21,0,.21]:[0])bullets.push({x:p.x,y:p.y,vx:Math.cos(a+off)*460,vy:Math.sin(a+off)*460,life:1.25,owner:p.id,damage:p.damage,r:5});p.cool=p.rate}
function update(dt){worldTime+=dt;spawnClock-=dt;if(spawnClock<=0&&enemies.length<Math.min(28,7+level*6)){spawn();spawnClock=rnd(.48,1.2)/Math.sqrt(level)}for(const p of players){let left=p.id===0?(keys.has('a')||touch[0].has('left')):(keys.has('ArrowLeft')||touch[1].has('left')),right=p.id===0?(keys.has('d')||touch[0].has('right')):(keys.has('ArrowRight')||touch[1].has('right')),up=p.id===0?(keys.has('w')||touch[0].has('up')):(keys.has('ArrowUp')||touch[1].has('up')),down=p.id===0?(keys.has('s')||touch[0].has('down')):(keys.has('ArrowDown')||touch[1].has('down'));let dx=Number(right)-Number(left),dy=Number(down)-Number(up),m=Math.hypot(dx,dy)||1;p.x=clamp(p.x+dx/m*p.speed*dt,17,W-17);p.y=clamp(p.y+dy/m*p.speed*dt,85,H-17);if(dx)p.face=Math.sign(dx);if((p.id===0?keys.has(' '):keys.has('Enter'))||touch[p.id].has('jump'))p.flight=Math.max(p.flight,.43+p.wing);p.flight=Math.max(0,p.flight-dt);p.cool-=dt;p.inv=Math.max(0,p.inv-dt);if(p.cool<=0)shoot(p)}for(const e of enemies){e.hit=Math.max(0,e.hit-dt);let p=players.reduce((best,p)=>dist(e,p)<dist(e,best)?p:best,players[0]);let a=Math.atan2(p.y-e.y,p.x-e.x);let wob=Math.sin(worldTime*5+e.seed);e.x+=(Math.cos(a)+(e.type===0?Math.sin(worldTime*3+e.seed)*.3:e.type===1?Math.cos(worldTime*5+e.seed)*.65:0))*e.speed*dt;e.y+=(Math.sin(a)+(e.type===0?Math.cos(worldTime*3+e.seed)*.3:e.type===1?Math.sin(worldTime*5+e.seed)*.65:0))*e.speed*dt;if(dist(e,p)<e.s+14&&p.inv<=0&&p.flight<=0){p.hp-=1;p.inv=1.1;burst(p.x,p.y,'#ff7474',8);if(p.hp<=0){p.hp=0;if(players.every(p=>p.hp<=0)){lose();return}}}}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies){if(dist(b,e)<e.s+b.r&&b.life>0){e.hp-=b.damage;e.hit=.15;b.life=0;burst(b.x,b.y,'#ffdb60',3);if(e.hp<=0){e.dead=true;kills++;coins+=e.type===2?3:e.type===1?2:1;burst(e.x,e.y,e.type===0?'#b395ed':e.type===1?'#fc83b8':'#78d9e5',12);if(Math.random()<.13)drops.push({x:e.x,y:e.y,type:'heart',life:10})}break}}}enemies=enemies.filter(e=>!e.dead);bullets=bullets.fil function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function drawBird(p){ctx.save();ctx.translate(p.x,p.y-(p.flight?12+Math.sin(worldTime*15)*5:Math.sin(worldTime*6+p.id)*2));let k=1+(level-1)*.18;ctx.scale(k,k);if(p.inv&&Math.floor(worldTime*12)%2){ctx.restore();return}ellipse(0,19,18,6,'#204f5180');ctx.scale(p.face,1);let c=p.id?'#fdfaf1':'#ffe04c',shadow=p.id?'#d5e7ed':'#f3ad33';ellipse(-12,1,14,8,shadow);ellipse(9,0,19,15,c);ellipse(-11,-10,15,15,c);ctx.save();ctx.translate(7,0);ctx.rotate(Math.sin(worldTime*17)*.32+(p.flight?-.6:0));ellipse(-1,-9,17,8,shadow);ctx.restore();ellipse(-17,-16,3.5,5,'#223646');ellipse(-18,-17,1.2,1.8,'#fff');ctx.fillStyle='#ff9d41';ctx.beginPath();ctx.moveTo(-24,-9);ctx.lineTo(-39,-5);ctx.lineTo(-24,-2);ctx.fill();if(p.id===0){ellipse(-15,-29,5,9,c);ellipse(-3,-28,5,9,c);ellipse(-15,-34,3,3,shadow);ellipse(-3,-33,3,3,shadow)}else{ctx.strokeStyle='#456374';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,-25);ctx.lineTo(-10,-39);ctx.stroke();ellipse(-10,-41,5,5,'#8bf0db');ctx.strokeStyle='#edfaff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-10,-41,8,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}ctx.fillStyle='#e48b45';ctx.fillRect(-3,12,3,6);ctx.fillRect(8,12,3,6);if(p.weapon){ctx.strokeStyle='#6c7c9b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(16,-4);ctx.lineTo(35,-4);ctx.stroke()}ctx.restore();ctx.fillStyle='#23383e99';ctx.fillRect(p.x-19,p.y-31-(level-1)*4,38,5);ctx.fillStyle='#80e597';ctx.fillRect(p.x-19,p.y-31-(level-1)*4,38*p.hp/p.maxHp,5)}
function drawMonster(e){ctx.save();ctx.translate(e.x,e.y);let c=e.type===0?'#b29bf5':e.type===1?'#fc7caf':'#61c5dc';if(e.hit)c='#fff';ctx.rotate(e.type===1?Math.sin(worldTime*6+e.seed)*.25:0);ctx.beginPath();let n=e.type===2?8:12;for(let i=0;i<=n;i++){let t=i/n*Math.PI*2,r=e.s*(e.type===0?1+.12*Math.sin(worldTime*6+e.seed+i*2):e.type===1?1+.3*Math.sin(i*3+worldTime*3):1+(i%2)*.23);let x=Math.cos(t)*r,y=Math.sin(t)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#425067';ctx.lineWidth=2;ctx.stroke();if(e.type===2){ctx.strokeStyle='#365b67';for(let a of [-.8,.8]){ctx.beginPath();ctx.moveTo(a*9,-12);ctx.lineTo(a*12,-22);ctx.stroke()}}ellipse(-6,-3,3,4,'#263b49');ellipse(6,-3,3,4,'#263b49');ctx.beginPath();ctx.arc(0,6,4,0,Math.PI);ctx.strokeStyle='#263b49';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function draw(){ctx.fillStyle='#a8d790';ctx.fillRect(0,0,W,H);ctx.fillStyle='#9acb83';for(let y=82;y<H;y+=56){for(let x=(Math.floor(y/56)%2)*30;x<W;x+=65)ellipse(x,y,15,5,'#addc95')}for(const f of flowers){ellipse(f.x,f.y,3,3,f.c);ellipse(f.x+3,f.y+2,2,2,'#f8ce63')}for(const c of cliffs){rounded(c.x+8,c.y+11,c.w,c.h,18,'#7b705e');rounded(c.x,c.y,c.w,c.h,18,'#d8c3a0');rounded(c.x+7,c.y+8,c.w-14,c.h-16,13,'#eccfa6');ctx.strokeStyle='#b18f62';ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.strokeRect(c.x+12,c.y+12,c.w-24,c.h-24);ctx.setLineDash([])}for(const t of trees){ellipse(t.x,t.y+8,11*t.s,5*t.s,'#648b63');ellipse(t.x,t.y,13*t.s,13*t.s,'#458b6f');ellipse(t.x-4*t.s,t.y-3*t.s,9*t.s,10*t.s,'#5aa478');ellipse(t.x+4*t.s,t.y-4*t.s,7*t.s,8*t.s,'#6cb887')}ctx.fillStyle='#eaf6db';ctx.fillRect(0,0,W,69);ctx.fillStyle='#3d6b67';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(`🌿 Chapter ${level}: ${['The Little Birds','The Growing Forest','The Parents’ Meadow'][Math.min(level-1,2)]} 🌿`,W/2,44);for(const d of drops){ellipse(d.x,d.y,11,11,'#f9fcde');ctx.font='18px sans-serif';ctx.fillText('💚',d.x,d.y+6)}for(const b of bullets){ellipse(b.x,b.y,b.r+2,b.r+2,'#fff0a9');ellipse(b.x,b.y,b.r,b.r,'#ff8e3c')}for(const e of enemies)drawMonster(e);for(const p of players)drawBird(p);for(const a of particles){ctx.globalAlpha=clamp(a.life*2,0,1);ellipse(a.x,a.y,3,3,a.color)}ctx.globalAlpha=1;if(level===3&&kills>=goal-12){ctx.font='45px sans-serif';ctx.fillText('🏡',W*.85,H*.18)}if(players.length===2){ctx.font='bold 11px system-ui';ctx.fillStyle='#273745';for(const p of players)ctx.fillText(p.id?'SWAMI':'DUCKY',p.x,p.y-44-(level-1)*4)}}
function frame(now){let dt=Math.min((now-last)/1000||0,.033);last=now;if(!paused)update(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key))e.preventDefault();keys.add(e.key.length===1?e.key.toLowerCase():e.key);if(e.key==='Escape'&&!overlay.classList.contains('hidden')){hide()}else if(e.key==='Escape'&&overlay.classList.contains('hidden'))pause()});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());document.getElementById('pads').addEventListener('pointerdown',e=>{let b=e.target.closest('[data-dir]');if(!b)return;e.preventDefault();b.setPointerCapture(e.pointerId);touch[Number(b.dataset.p)].add(b.dataset.dir)});document.getElementById('pads').addEventListener('pointerup',e=>{let b=e.target.closest('[data-dir]');if(b)touch[Number(b.dataset.p)].delete(b.dataset.dir)});document.getElementById('pads').addEventListener('pointercancel',()=>touch.forEach(s=>s.clear()));document.getElementById('pads').addEventListener('lostpointercapture',e=>{let b=e.target.closest('[data-dir]');if(b)touch[Number(b.dataset.p)].delete(b.dataset.dir)},true);document.addEventListener('visibilitychange',()=>{if(document.hidden)touch.forEach(s=>s.clear())});function pause(){if(overlay.classList.contains('hidden'))show('<h1>⏸ Adventure Paused</h1><p>Catch your breath!</p><button class="bigbtn" data-action="resume">Resume playing</button><button class="bigbtn secondary" data-action="home">Main menu</button>');else hide()}document.getElementById('shopBtn').onclick=()=>{if(players.length)shop()};document.getElementById('sleepBtn').onclick=()=>{if(players.length&&level<3)sleep();else if(level===3)toast('You are grown up! Find your parents!')};document.getElementById('pauseBtn').onclick=pause;panel.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.buy){buy(b.dataset.buy);return}switch(b.dataset.action){case'start1':case'again':start(1);break;case'start2':start(2);break;case'resume':hide();break;case'next':next();break;case'home':intro();break;case'retry':for(const p of players)p.hp=p.maxHp;enemies=[];bullets=[];hide();break}});intro();requestAnimationFrame(frame);
})();
</script></body></html>
